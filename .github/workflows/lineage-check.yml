name: Lineage Check

on:
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    branches: [dev]
    paths:
      - 'linguatag/data/lineage.json'
      - 'scripts/build_lineage.py'
      - '.github/workflows/lineage-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-latest
    env:
      UV_SYSTEM_PYTHON: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TigreGotico/orthography2ipa
          ref: dev
          path: orthography2ipa
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Install linguatag
        run: uv pip install --prerelease=allow .
      - name: Compare the lineage table with a rebuild
        run: python scripts/build_lineage.py orthography2ipa HEAD --check
