<text x="40" y="28" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">usable match</text>
<rect x="170" y="14" width="16" height="16" fill="#E0883A"/>
<text x="194" y="28" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">not a usable match</text>
<line x1="200" y1="44" x2="200" y2="394" stroke="#80808055"/>
<text x="200" y="414" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">0</text>
