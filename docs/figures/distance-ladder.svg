<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">lang_distance of 13 tag pairs</title>
<desc id="d">The distance of 13 tag pairs, with the default limit of 10: pt to pt-PT 0, nb to no 1, en-AU to en-GB 3, en-CA to en-US 4, arz to ar 5, pt to pt-BR 5, gsw to de 8, yue-HK to zh-HK 10, zh-Hans to zh-Hant 54, de to gsw 84, en to fr 84, und to en 100, yue to cmn 100.</desc>
