<text x="452" y="414" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">60</text>
<line x1="536" y1="44" x2="536" y2="394" stroke="#80808055"/>
<text x="536" y="414" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">80</text>
<line x1="620" y1="44" x2="620" y2="394" stroke="#80808055"/>
<text x="620" y="414" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">100</text>
<line x1="242" y1="44" x2="242" y2="394" stroke="#808080" stroke-dasharray="5 4"/>
<text x="190" y="69" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">pt to pt-PT</text>
