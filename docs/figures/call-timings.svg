<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266" role="img" aria-labelledby="t d">
<title id="t">Time of the first call and of a warm call</title>
<desc id="d">Median milliseconds in a fresh process, on a log scale: import 29.9 ms, first standardize_lang 2.88 ms, first with_default_region 6 ms, first lang_distance 6.84 ms, first closest_lang 12.3 ms, warm, tag not seen before 0.531 ms, warm, tag seen before 0.0066 ms.</desc>
<line x1="250.0" y1="12" x2="250.0" y2="236" stroke="#80808055"/>
<text x="250.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">1 µs</text>
<line x1="330.0" y1="12" x2="330.0" y2="236" stroke="#80808055"/>
<text x="330.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">10 µs</text>
<line x1="410.0" y1="12" x2="410.0" y2="236" stroke="#80808055"/>
<text x="410.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">0.1 ms</text>
<line x1="490.0" y1="12" x2="490.0" y2="236" stroke="#80808055"/>
<text x="490.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">1 ms</text>
<line x1="570.0" y1="12" x2="570.0" y2="236" stroke="#80808055"/>
<text x="570.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">10 ms</text>
<line x1="650.0" y1="12" x2="650.0" y2="236" stroke="#80808055"/>
<text x="650.0" y="256" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">100 ms</text>
<text x="240" y="37" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">import</text>
<rect x="250" y="20" width="358.1" height="22" fill="#4C8DD6"/>
<text x="616.1" y="37" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">29.9 ms</text>
<text x="240" y="67" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">first standardize_lang</text>
<rect x="250" y="50" width="276.7" height="22" fill="#4C8DD6"/>
<text x="534.7" y="67" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">2.9 ms</text>
<text x="240" y="97" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">first with_default_region</text>
<rect x="250" y="80" width="302.2" height="22" fill="#4C8DD6"/>
<text x="560.2" y="97" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">6.0 ms</text>
<text x="240" y="127" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">first lang_distance</text>
<rect x="250" y="110" width="306.8" height="22" fill="#4C8DD6"/>
<text x="564.8" y="127" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">6.8 ms</text>
<text x="240" y="157" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">first closest_lang</text>
<rect x="250" y="140" width="327.2" height="22" fill="#4C8DD6"/>
<text x="585.2" y="157" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">12.3 ms</text>
<text x="240" y="187" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">warm, tag not seen before</text>
<rect x="250" y="170" width="218.0" height="22" fill="#E0883A"/>
<text x="476.0" y="187" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">0.5 ms</text>
<text x="240" y="217" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">warm, tag seen before</text>
<rect x="250" y="200" width="65.6" height="22" fill="#E0883A"/>
<text x="323.6" y="217" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">7 µs</text>
